[nosetests]
verbosity=2
with-spec=1
spec-color=1
with-coverage=1
cover-package=service

[coverage:run]
data_file = .coverage
omit = 
    venv/*
    */__init__.py
    */site-packages/*

[coverage:report]
show_missing = True

[flake8]
per-file-ignores =
    */__init__.py: F401 E501
max-line-length = 127

[pylint.messages control]
disable = 
    C0330,
    C0326
